name: Daily Briefing

on:
  # cron-job.org에서 workflow_dispatch로 트리거 (아침 7시, 저녁 7시 KST)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  briefing:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run briefing pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          LOG_LEVEL: INFO
          TIMEZONE: Asia/Seoul
        run: |
          python -m src.main

      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "clipboard055-bot"
          git config user.email "bot@clipboard055"
          git add state/seen.db
          git diff --cached --quiet || git commit -m "chore: DB 업데이트 ($(date +%Y-%m-%d))"
          git push

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: briefing-logs-${{ github.run_number }}
          path: logs/
          retention-days: 7
