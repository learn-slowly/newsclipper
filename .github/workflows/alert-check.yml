name: Alert Check

on:
  # 3시간마다 점검 (UTC 기준 0, 3, 6, 9, 12, 15, 18, 21시)
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

concurrency:
  group: db-state-lock
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  alert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Run alert pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          TELEGRAM_ADMIN_USER_ID: ${{ secrets.TELEGRAM_ADMIN_USER_ID }}
          LOG_LEVEL: INFO
          TIMEZONE: Asia/Seoul
        run: |
          python -m src.main --mode alert

      - name: Commit DB changes
        if: always()
        run: |
          git config user.name "clipboard055-bot"
          git config user.email "bot@clipboard055"
          git add state/seen.db
          if ! git diff --cached --quiet; then
            git commit -m "chore: DB 업데이트 (속보 점검)"
            git push
          fi
