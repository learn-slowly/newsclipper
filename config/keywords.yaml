# 키워드 교차 매칭 설정
# 지역명 × 카테고리 키워드가 동시에 기사 제목/요약에 등장하면 중요도를 가산한다.

# 경남 지역명 (이 중 하나가 포함되어야 교차 매칭 성립)
regions:
  - 양산
  - 김해
  - 창원
  - 마산
  - 진해
  - 거제
  - 진주

# 카테고리별 키워드 (지역명과 교차 매칭)
categories:
  labor:
    - 노동
    - 파업
    - 산재
    - 노조
    - 플랫폼 노동
    - 근로기준법
    - 최저임금
    - 해고
    - 비정규직
    - 하청
  climate:
    - 기후
    - 환경
    - 탄소중립
    - 재생에너지
    - 생태
    - 미세먼지
    - 오염
    - 폐기물
  gender_minority:
    - 여성
    - 성평등
    - 성폭력
    - 성소수자
    - 장애인
    - 이주민
    - 차별
  youth:
    - 청년
    - 청소년
    - 주거
    - 학자금
    - 교육
    - 학교폭력
  welfare_care:
    - 복지
    - 돌봄
    - 국민연금
    - 기초생활
    - 의료
    - 노인
    - 아동
  regional_politics:
    - 도의회
    - 시의회
    - 도지사
    - 시장
    - 선거
    - 의원
    - 지방의회
  justice_party:
    - 정의당
  allied_parties:
    - 노동당
    - 녹색당
    - 진보당

# 교차 매칭 시 가산 점수 (기본 +1)
boost_score: 1

# 신뢰 매체 가산 점수 (feeds.yaml에서 trusted 미지정 또는 true인 매체)
# 2026-07-03: 전체 기사의 82%에 적용되어 변별력이 없었으므로 0으로 (점수 인플레 방지)
trusted_boost: 0

# 발송 기준 중요도: 이 점수 이상만 브리핑에 포함 (분량 조절은 이 값만 바꾸면 됨)
min_importance: 4

# 사전 필터용 키워드 (구글 알리미 등 비신뢰 소스에서 이 키워드가 하나도 없으면 AI 분류 스킵)
# 카테고리 키워드를 모두 포함하되, 추가로 넓은 범위의 키워드도 포함
