# Phase 2에서 여성·청년·복지·연대당 피드 확대

# ── 경남 지역지 ──────────────────────────────
regional:
  - name: 경남도민일보
    url: https://www.idomin.com/rss/allArticle.xml
    scope: gyeongnam
  - name: 경남일보
    url: https://cdn.gnnews.co.kr/rss/gn_rss_allArticle.xml
    scope: gyeongnam

# ── 노동 전문 매체 ──────────────────────────────
