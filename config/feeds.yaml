  - name: 매일노동뉴스
    url: https://www.labortoday.co.kr/rss/allArticle.xml
    scope: national
  # 민중의소리: RSS 폐기(404) → config/scrape.yaml에서 섹션 스크래핑으로 수집

# ── 기후·환경 전문 매체 ──────────────────────────
climate:
  - name: 뉴스펭귄
    url: https://www.newspenguin.com/rss/allArticle.xml
    scope: national

# ── 진보 매체 (전국 이슈 + 정당 동향) ───────────────
progressive:
  - name: 프레시안
    url: https://www.pressian.com/rss/allArticle.xml
    scope: national
  - name: 오마이뉴스
    url: https://rss.ohmynews.com/rss/ohmynews.xml
    scope: national
  - name: 참세상
    url: https://www.newscham.net/rss/allArticle.xml
    scope: national

# ── 주요 일간지 (정치/사회 섹션) ──────────────────
mainstream:
  - name: 한겨레
    url: https://www.hani.co.kr/rss/
    scope: national
  - name: 경향신문
    url: https://www.khan.co.kr/rss/rssdata/total_news.xml
    scope: national

