# 웹 스크래핑 대상 매체
# RSS가 없는 경남 지역 매체를 스크래핑으로 수집한다

sources:
  # 프레시안: RSS 폐기(2026-08 확인) → 섹션 페이지 스크래핑으로 전환.
  # 기사 URL 패턴: /pages/articles/{id}
  - name: 프레시안
    url: https://www.pressian.com/pages/news-politics   # 정치
    scope: national
    base_url: https://www.pressian.com
    timeout: 30
  - name: 프레시안
    url: https://www.pressian.com/pages/news-society     # 사회
    scope: national
    base_url: https://www.pressian.com
    timeout: 30
  - name: 프레시안
    url: https://www.pressian.com/pages/nation-kn         # 경남
    scope: gyeongnam
    base_url: https://www.pressian.com
    timeout: 30


  - name: MBC경남
    url: https://www.mbcgn.kr/01_new/new01_list.asp
    scope: gyeongnam
    # 서버 응답이 느려 기본 15초로는 자주 타임아웃 → 30초로 늘림
    timeout: 30
    # onclick="javascript:NewsViewFunc(ID)" 패턴에서 ID 추출
    selector: "a[href*='NewsViewFunc']"
    base_url: https://www.mbcgn.kr
    article_url_template: "https://www.mbcgn.kr/01_new/new01_view.asp?mn_lnk=B&idx={id}"

  # 민중의소리: RSS 폐기(404) → 섹션 페이지 스크래핑으로 전환.
  # vop.co.kr은 낡은 1024비트 DH 키를 써서 legacy_ssl 필요.
  # 섹션은 필요에 따라 추가·삭제 가능 (예: /culture, /science)
  - name: 민중의소리
    url: https://www.vop.co.kr/society    # 사회
    scope: national
    legacy_ssl: true
    base_url: https://www.vop.co.kr
  - name: 민중의소리
    url: https://www.vop.co.kr/politics   # 정치
    scope: national
    legacy_ssl: true
    base_url: https://www.vop.co.kr
  - name: 민중의소리
    url: https://www.vop.co.kr/economy    # 경제
    scope: national
    legacy_ssl: true
    base_url: https://www.vop.co.kr

  # KBS경남: 봇 접근 완전 차단 — RSS도 없음. 추후 대안 검토

  - name: KNN
    url: https://news.knn.co.kr/news
    scope: gyeongnam
    selector: "a[href*='/news/article/']"
    base_url: https://news.knn.co.kr

  - name: KBS경남
    url: https://www.youtube.com/@kbsnews_gyeongnam/videos
    scope: gyeongnam
    # 유튜브 채널 페이지에서 영상 제목·URL 스크래핑 (RSS 차단, 봇 차단 우회)

  # 경남신문: RSS 없음. 2026-08-19 재확인 — 홈페이지(/)는 일반 HTML로 기사 링크 노출 (JS 로딩 아님)
  # 기사 URL 패턴: /news/articleView.php?idxno={id}
  - name: 경남신문
    url: https://www.knnews.co.kr
    scope: gyeongnam
    base_url: https://www.knnews.co.kr
    timeout: 30

  # 웅상신문(양산웅상신문, 2026-08-15 제호 변경): RSS 없음 — 모바일 목록 페이지 스크래핑
  # 기사 URL 패턴: view.php?idx={id}
  - name: 양산웅상신문
    url: http://m.ungsangnews.com/list.php?part_idx=291
    scope: gyeongnam
    base_url: http://m.ungsangnews.com
    timeout: 30

  # ── 지자체·교육청 공식 보도자료 ──────────────────
  - name: 양산시청
    url: https://www.yangsan.go.kr/portal/saeol/news/list.do?mid=0105010000
    scope: gyeongnam
    base_url: https://www.yangsan.go.kr
    timeout: 30

  - name: 창원시청
    url: https://www.changwon.go.kr/cwportal/10310/10429/10432.web
    scope: gyeongnam
    base_url: https://www.changwon.go.kr
    timeout: 30

  - name: 경남교육청
    url: https://www.gne.go.kr/pr/user/bbs/BD_selectBbsList.do?q_bbsSn=1350
    scope: gyeongnam
    base_url: https://www.gne.go.kr
    timeout: 30
